<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美丽心情 · 离线</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .card { background: white; border-radius: 16px; padding: 40px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .icon { font-size: 64px; margin-bottom: 16px; }
        h1 { color: #ff6b6b; margin-bottom: 12px; }
        p { color: #636e72; line-height: 1.6; }
        .btn { display: inline-block; margin-top: 20px; padding: 12px 24px; background: linear-gradient(135deg, #ff6b6b, #ff8e8e); color: white; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📴</div>
        <h1>离线状态</h1>
        <p>当前没有网络连接，请检查网络后刷新页面。</p>
        <p style="font-size:13px;color:#b2bec3;margin-top:12px;">已缓存的数据仍可正常使用。</p>
        <button class="btn" onclick="location.reload()">刷新页面</button>
    </div>
</body>
</html>
