<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>美丽心情 · 生活管理</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #ff6b6b;
            --secondary: #4ecdc4;
            --light: #f7f7f7;
            --text: #2d3436;
            --text-light: #636e72;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --radius: 16px;
            --radius-sm: 12px;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .app-container { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--light); position: relative; box-shadow: 0 0 60px rgba(0,0,0,0.3); }
        .header { background: linear-gradient(135deg, var(--primary) 0%, #ff8e8e 100%); color: white; padding: 40px 24px 30px; border-radius: 0 0 var(--radius) var(--radius); }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .date-display { font-size: 14px; opacity: 0.9; }
        .nav-tabs { display: flex; gap: 8px; padding: 16px; overflow-x: auto; background: white; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
        .nav-tab { flex-shrink: 0; padding: 10px 20px; border-radius: 25px; background: var(--light); border: none; font-size: 14px; font-weight: 500; color: var(--text-light); cursor: pointer; transition: 0.3s; }
        .nav-tab.active { background: var(--primary); color: white; }
        .content { padding: 20px; padding-bottom: 100px; }
        .section { display: none; animation: fadeIn 0.4s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card { background: white; border-radius: var(--radius); padding: 24px; margin-bottom: 16px; box-shadow: var(--shadow); }
        .card-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 14px; font-weight: 500; color: var(--text-light); margin-bottom: 8px; }
        .form-input, .form-select { width: 100%; padding: 14px 16px; border: 2px solid #e0e0e0; border-radius: var(--radius-sm); font-size: 16px; }
        .btn { width: 100%; padding: 14px 24px; border: none; border-radius: var(--radius-sm); font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), #ff8e8e); color: white; box-shadow: 0 4px 15px rgba(255,107,107,0.4); }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-small { padding: 8px 16px; font-size: 14px; width: auto; }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; display: flex; justify-content: space-around; padding: 12px 0 24px; box-shadow: 0 -4px 20px rgba(0,0,0,0.08); z-index: 1000; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; color: var(--text-light); }
        .nav-item.active { color: var(--primary); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: var(--radius); max-width: 400px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); }
        .history-list { max-height: 300px; overflow-y: auto; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .anniversary-card { background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(10px); border-radius: 24px; padding: 24px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.5); }
        .couple-info { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        .person-card { background: rgba(255, 255, 255, 0.5); border-radius: 20px; padding: 16px; text-align: center; backdrop-filter: blur(5px); }
        .avatar { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 2em; background: rgba(255,255,255,0.8); }
        .progress-bar { width: 100%; height: 6px; background: #e0e0e0; border-radius: 3px; margin-top: 8px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #ff9ec0); width: 0%; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
        .stat-card { background: rgba(255,255,255,0.5); border-radius: 16px; padding: 12px; text-align: center; }
        .stat-number { font-size: 1.2em; font-weight: 700; color: var(--primary); }
        .timeline-item { display: flex; align-items: center; margin-bottom: 16px; background: rgba(255,255,255,0.5); border-radius: 40px; padding: 8px 16px; }
        .timeline-date { background: linear-gradient(135deg, var(--primary), #ff9ec0); color: white; padding: 8px 12px; border-radius: 30px; font-weight: 600; min-width: 100px; text-align: center; margin-right: 12px; }
        .upcoming-events { margin-top: 16px; }
        .event-card { background: rgba(255,255,255,0.5); border-left: 5px solid var(--primary); padding: 12px; border-radius: 16px; margin-bottom: 10px; }
        .event-card.urgent { border-left-color: #c44569; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(196,69,105,0.4); } 70% { box-shadow: 0 0 0 8px rgba(196,69,105,0); } 100% { box-shadow: 0 0 0 0 rgba(196,69,105,0); } }
        .holiday-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
        .holiday-card { background: rgba(255,255,255,0.5); border-radius: 20px; padding: 16px; text-align: center; }
        .delete-btn { background: none; border: none; color: #f43f5e; font-size: 16px; cursor: pointer; }
        .placeholder-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .placeholder-card { background: white; border-radius: var(--radius); padding: 24px; text-align: center; cursor: pointer; border: 2px dashed #e0e0e0; }
        .placeholder-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.6; }
        .stage-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #e0e0e0; padding-bottom: 8px; overflow-x: auto; }
        .stage-tab { background: none; border: none; padding: 8px 16px; font-size: 15px; font-weight: 500; color: var(--text-light); cursor: pointer; border-radius: 30px; white-space: nowrap; }
        .stage-tab.active { background: var(--primary); color: white; }
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .pregnancy-header { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; text-align: center; }
        .week-badge { font-size: 28px; font-weight: 800; }
        .period-calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 20px; }
        .calendar-header { text-align: center; font-size: 12px; font-weight: 600; color: var(--text-light); padding: 8px; }
        .calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 14px; cursor: pointer; transition: all 0.3s ease; }
        .calendar-day.period { background: var(--primary); color: white; }
        .calendar-day.today { border: 2px solid var(--primary); }
        .period-status { display: flex; align-items: center; justify-content: center; gap: 20px; padding: 20px; background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 100%); border-radius: var(--radius); color: white; margin-bottom: 20px; }
        .status-item { text-align: center; }
        .status-number { font-size: 36px; font-weight: 700; }
        .weight-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
        .stat-box { background: var(--light); padding: 16px; border-radius: var(--radius-sm); text-align: center; }
        .stat-value { font-size: 24px; font-weight: 700; color: var(--primary); }
        .weather-input { display: flex; gap: 12px; margin-bottom: 16px; }
        .outfit-display { text-align: center; padding: 40px 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: var(--radius); color: white; margin-bottom: 20px; }
        .outfit-emoji { font-size: 80px; display: block; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
        .chart-container { height: 200px; margin: 20px 0; background: var(--light); border-radius: var(--radius-sm); padding: 16px; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header"><h1>美丽心情</h1><div class="date-display" id="currentDate"></div></div>
    <div class="nav-tabs">
        <button class="nav-tab active" data-section="outfit">👔 穿搭</button>
        <button class="nav-tab" data-section="weight">⚖️ 体重</button>
        <button class="nav-tab" data-section="period">🌸 生理期</button>
        <button class="nav-tab" data-section="pregnancy">🤰 孕期全周期</button>
        <button class="nav-tab" data-section="diary">📔 日记</button>
        <button class="nav-tab" data-section="more">➕ 更多</button>
    </div>
    <div class="content">
        <!-- 穿搭模块（完整） -->
        <div class="section active" id="outfit-section">
            <div class="outfit-display" id="outfitDisplay"><span class="outfit-emoji" id="outfitEmoji">👕</span><div id="outfitDesc">今日穿搭建议</div><div id="outfitTemp">请输入温度</div></div>
            <div class="card"><div class="card-title">🌡️ 天气设置</div><div class="weather-input"><input type="number" id="tempInput" class="form-input" placeholder="温度°C"><select id="weatherCondition" class="form-input"><option value="sunny">晴天</option><option value="cloudy">多云</option><option value="rainy">雨天</option></select></div><button class="btn btn-primary" onclick="generateOutfit()">生成建议</button></div>
            <div class="card"><div class="card-title">👚 衣橱管理</div><button class="btn btn-primary btn-small" onclick="alert('衣橱管理开发中')">打开衣橱</button></div>
            <div class="card"><div class="card-title">📸 穿搭记录</div><input type="file" id="outfitPhoto" accept="image/*" onchange="previewOutfitPhoto(this)"><div id="outfitPreview" style="display:none"><img id="outfitImg" style="width:100%"></div><input type="text" id="outfitNote" class="form-input" placeholder="备注"><button class="btn btn-primary" onclick="saveOutfitRecord()">保存</button><div id="outfitHistory" class="history-list"></div></div>
        </div>
        <!-- 体重模块 -->
        <div class="section" id="weight-section"><div class="card"><div class="card-title">⚖️ 体重记录</div><div class="weight-stats"><div class="stat-box"><div class="stat-value" id="currentWeight">--</div><div>当前体重(kg)</div></div><div class="stat-box"><div class="stat-value" id="currentBodyFat">--</div><div>体脂率(%)</div></div></div><input type="number" id="weightInput" class="form-input" placeholder="体重kg"><input type="number" id="bodyFatInput" class="form-input" placeholder="体脂率%"><input type="date" id="weightDate" class="form-input"><button class="btn btn-primary" onclick="saveWeight()">保存</button></div><div class="card"><div class="card-title">📈 趋势图</div><canvas id="weightCanvas" width="360" height="200"></canvas><div id="weightHistory" class="history-list"></div></div></div>
        <!-- 生理期模块 -->
        <div class="section" id="period-section"><div class="period-status"><div class="status-item"><div class="status-number" id="cycleDay">--</div><div>周期第几天</div></div><div class="status-item"><div class="status-number" id="nextPeriod">--</div><div>距离下次</div></div></div><div id="predictionDetail"></div><div class="card"><div class="card-title">🗓️ 日历</div><div class="period-calendar" id="periodCalendar"></div></div><div class="card"><div class="card-title">✏️ 记录</div><input type="date" id="periodStart" class="form-input"><input type="date" id="periodEnd" class="form-input"><div><label><input type="checkbox" class="period-symptom" value="痛经">痛经</label><label><input type="checkbox" class="period-symptom" value="头痛">头痛</label></div><button class="btn btn-primary" onclick="savePeriod()">保存</button></div><div class="card"><div class="card-title">📜 历史</div><div id="periodHistory" class="period-history-list"></div></div></div>
        <!-- 孕期全周期模块 -->
        <div class="section" id="pregnancy-section">
            <div class="pregnancy-header"><div class="week-badge" id="gestationalWeek">--</div><div id="pregnancyStatus"></div><button class="btn-small" onclick="showPregnancySettings()">设置预产期</button></div>
            <div class="stage-tabs"><button class="stage-tab" data-stage="preconception">备孕</button><button class="stage-tab" data-stage="pregnancy">怀孕</button><button class="stage-tab" data-stage="delivery">生产</button><button class="stage-tab" data-stage="postpartum">月子</button><button class="stage-tab active" data-stage="baby">宝宝成长</button></div>
            <div id="preconception-panel" class="stage-panel" style="display:none;"><div class="card"><div class="card-title">备孕记录</div><input type="number" id="preBbt" class="form-input" placeholder="基础体温℃"><select id="preOvulation" class="form-select"><option>阴性</option><option>阳性</option></select><select id="preFolic" class="form-select"><option>是</option><option>否</option></select><input type="date" id="preDate" class="form-input"><button class="btn btn-primary" onclick="savePreconceptionRecord()">保存</button><div id="preHistoryList" class="history-list"></div></div></div>
            <div id="pregnancy-panel" class="stage-panel" style="display:none;"><div class="card"><div class="card-title">孕期指标</div><div class="metrics-grid"><input type="number" id="pregWeight" placeholder="体重kg"><input type="text" id="pregBp" placeholder="血压"><input type="number" id="pregGlucose" placeholder="血糖"><input type="number" id="pregFundal" placeholder="宫高cm"><input type="number" id="pregAbdominal" placeholder="腹围cm"><input type="number" id="pregFetalHr" placeholder="胎心率"><input type="number" id="pregFetalMove" placeholder="胎动次数"></div><textarea id="pregNote" class="form-input" rows="2"></textarea><input type="date" id="pregDate" class="form-input"><button class="btn btn-primary" onclick="savePregnancyRecord()">保存</button><canvas id="pregWeightChart" width="360" height="150"></canvas><div id="pregHistoryList" class="history-list"></div></div></div>
            <div id="delivery-panel" class="stage-panel" style="display:none;"><div class="card"><div class="card-title">分娩记录</div><input type="date" id="deliveryDate" class="form-input"><select id="deliveryMode" class="form-select"><option>顺产</option><option>剖宫产</option></select><select id="babyGender" class="form-select"><option>女</option><option>男</option></select><input type="number" id="babyWeight" placeholder="体重g"><input type="number" id="babyLength" placeholder="身长cm"><input type="number" id="apgarScore" placeholder="Apgar评分"><input type="number" id="bloodLoss" placeholder="出血量ml"><button class="btn btn-primary" onclick="saveDeliveryRecord()">保存</button><div id="deliveryHistoryList" class="history-list"></div></div></div>
            <div id="postpartum-panel" class="stage-panel" style="display:none;"><div class="card"><div class="card-title">产后恢复</div><input type="number" id="ppUterus" placeholder="宫底高度cm"><select id="ppLochia" class="form-select"><option>少-淡红</option><option>中-红色</option></select><select id="ppWound" class="form-select"><option>良好</option><option>红肿</option></select><input type="number" id="ppMood" placeholder="情绪1-5"><select id="ppPelvic" class="form-select"><option>是</option><option>否</option></select><input type="date" id="ppDate" class="form-input"><button class="btn btn-primary" onclick="savePostpartumRecord()">保存</button><div id="ppHistoryList" class="history-list"></div></div></div>
            <div id="baby-panel" class="stage-panel"><div class="card"><div class="card-title">宝宝体重趋势</div><canvas id="babyWeightChart" width="360" height="150"></canvas></div><div class="card"><div class="card-title">💉 疫苗记录</div><button class="btn-small btn-primary" onclick="alert('疫苗功能开发中')">+添加</button><div id="vaccineList"></div></div><div class="card"><div class="card-title">🍼饭食&💩排泄</div><button class="btn-small btn-primary" onclick="alert('饭食功能开发中')">饭食</button><button class="btn-small btn-primary" onclick="alert('排泄功能开发中')">排泄</button><canvas id="foodExcreteChart" width="360" height="150"></canvas></div><div class="card"><div class="card-title">成长记录</div><input type="date" id="babyRecordDate" class="form-input"><input type="number" id="babyWeightInput" placeholder="体重kg" step="0.01"><input type="number" id="babyHeightInput" placeholder="身高cm" step="0.5"><button class="btn btn-primary" onclick="saveBabyRecord()">保存</button><div id="babyHistoryList" class="history-list"></div></div></div>
        </div>
        <!-- 日记模块 -->
        <div class="section" id="diary-section"><div class="card"><div class="card-title">📝 写日记</div><div class="mood-selector"><button class="mood-btn" data-mood="happy">😊</button><button class="mood-btn" data-mood="calm">😌</button><button class="mood-btn" data-mood="tired">😴</button></div><input type="date" id="diaryDate" class="form-input"><input type="text" id="diaryTitle" class="form-input" placeholder="标题"><textarea id="diaryContent" class="form-input" rows="4"></textarea><button class="btn btn-primary" onclick="saveDiary()">保存</button></div><div class="card"><div class="card-title">📚 日记列表</div><div id="diaryList" class="diary-list"></div></div></div>
        <!-- 更多模块（纪念日放在第一位） -->
        <div class="section" id="more-section">
            <div class="card"><div class="card-title">💕 纪念日提醒 · 自定义信息</div>
                <div class="form-group"><label class="form-label">男方姓名</label><input type="text" id="maleName" class="form-input" placeholder="先生"></div>
                <div class="form-group"><label class="form-label">男方农历生日（格式：年-月-日，例：1314-05-20 代表农历1314年五月二十）</label><input type="text" id="maleBirthLunar" class="form-input" placeholder="1314-05-20"></div>
                <div class="form-group"><label class="form-label">女方姓名</label><input type="text" id="femaleName" class="form-input" placeholder="女士"></div>
                <div class="form-group"><label class="form-label">女方农历生日（格式：年-月-日，例：1314-05-20 代表农历1314年五月二十）</label><input type="text" id="femaleBirthLunar" class="form-input" placeholder="1314-05-20"></div>
                <div class="form-group"><label class="form-label">初次相遇（公历）</label><input type="date" id="meetDate" class="form-input"></div>
                <div class="form-group"><label class="form-label">订婚纪念日（公历）</label><input type="date" id="engageDate" class="form-input"></div>
                <div class="form-group"><label class="form-label">结婚纪念日（公历）</label><input type="date" id="marryDate" class="form-input"></div>
                <button class="btn btn-primary" onclick="saveCoupleInfo()">保存信息</button>
                <div id="lunarPreview" style="margin-top:12px; font-size:13px; color:var(--primary);"></div>
            </div>
            <div class="anniversary-card" id="anniversaryDisplay">
                <div class="couple-info" id="coupleNames"></div>
                <div class="stats-grid" id="statsGrid"></div>
                <div id="timelineEvents"></div>
                <div class="upcoming-events"><h3>📅 即将到来</h3><div id="upcomingList"></div></div>
                <div class="holiday-grid"><div class="holiday-card"><div id="qixiDate"></div><div>七夕</div><div id="qixiCountdown"></div></div><div class="holiday-card"><div id="valentineDate"></div><div>情人节</div><div id="valentineCountdown"></div></div></div>
            </div>
            <div class="card"><div class="card-title">🎯 其他功能</div><div class="placeholder-grid"><div class="placeholder-card" onclick="alert('饮水记录开发中')"><div class="placeholder-icon">💧</div><div>饮水记录</div></div><div class="placeholder-card" onclick="alert('睡眠追踪开发中')"><div class="placeholder-icon">😴</div><div>睡眠追踪</div></div></div></div>
            <div class="card"><div class="card-title">⚙️ 数据管理</div><button class="btn btn-secondary" onclick="exportData()">导出数据</button><button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">导入数据</button><input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)"><button class="btn btn-secondary" onclick="clearAllData()">清空所有数据</button></div>
        </div>
    </div>
    <div class="bottom-nav">
        <div class="nav-item" data-section="outfit">👔</div><div class="nav-item" data-section="weight">⚖️</div><div class="nav-item" data-section="period">🌸</div><div class="nav-item" data-section="pregnancy">🤰</div><div class="nav-item" data-section="diary">📔</div><div class="nav-item" data-section="more">➕</div>
    </div>
</div>
<script>
    // ========== 工具函数 ==========
    function getLocalDateString(date = new Date()) { return date.toISOString().slice(0,10); }
    function showFeatureAlert(f) { alert(`${f}功能开发中`); }
    const DB_NAME = 'LifeFlowDB';
    const DB_VERSION = 8;
    let db;
    const initDB = () => new Promise((resolve,reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onerror = reject;
        req.onsuccess = () => { db = req.result; resolve(db); };
        req.onupgradeneeded = e => {
            const db = e.target.result;
            if(!db.objectStoreNames.contains('outfits')) db.createObjectStore('outfits', {keyPath:'id',autoIncrement:true});
            if(!db.objectStoreNames.contains('weight')) db.createObjectStore('weight', {keyPath:'id',autoIncrement:true});
            if(!db.objectStoreNames.contains('periods')) db.createObjectStore('periods', {keyPath:'id',autoIncrement:true});
            if(!db.objectStoreNames.contains('diaries')) db.createObjectStore('diaries', {keyPath:'id',autoIncrement:true});
            if(!db.objectStoreNames.contains('pregnancy_records')) db.createObjectStore('pregnancy_records', {keyPath:'id',autoIncrement:true});
            if(!db.objectStoreNames.contains('pregnancy_settings')) db.createObjectStore('pregnancy_settings', {keyPath:'id',autoIncrement:true});
            if(!db.objectStoreNames.contains('baby_records')) db.createObjectStore('baby_records', {keyPath:'id',autoIncrement:true});
            if(!db.objectStoreNames.contains('couple_info')) db.createObjectStore('couple_info', {keyPath:'id',autoIncrement:true});
        };
    });
    const addData = (store, data) => new Promise((res,rej) => { let tx = db.transaction(store,'readwrite'); let r = tx.objectStore(store).add(data); r.onsuccess = () => res(r.result); r.onerror = rej; });
    const getAllData = store => new Promise((res,rej) => { let tx = db.transaction(store,'readonly'); let r = tx.objectStore(store).getAll(); r.onsuccess = () => res(r.result); r.onerror = rej; });
    const updateData = (store, data) => new Promise((res,rej) => { let tx = db.transaction(store,'readwrite'); let r = tx.objectStore(store).put(data); r.onsuccess = () => res(r.result); r.onerror = rej; });
    const deleteData = (store, id) => new Promise((res,rej) => { let tx = db.transaction(store,'readwrite'); let r = tx.objectStore(store).delete(id); r.onsuccess = res; r.onerror = rej; });
    const clearStore = store => new Promise((res,rej) => { let tx = db.transaction(store,'readwrite'); let r = tx.objectStore(store).clear(); r.onsuccess = res; r.onerror = rej; });

    // ========== 纪念日模块（正确农历转换）==========
    const lunarCalendar = {
        lunarInfo: [0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,0x06ca0,0x0b550,0x15355,0x04da0,0x0a5d0,0x14573,0x052d0,0x0a9a8,0x0e950,0x06aa0,0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b5a0,0x195a6,0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,0x05aa0,0x076a3,0x096d0,0x04bd7,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0],
        getLunarYearDays(y) { let sum=348; for(let i=0x8000;i>0x8;i>>=1) sum+=(this.lunarInfo[y]&i)?1:0; return sum+this.getLeapDays(y); },
        getLeapMonth(y) { return this.lunarInfo[y] & 0xf; },
        getLeapDays(y) { if(this.getLeapMonth(y)) return (this.lunarInfo[y]&0x10000)?30:29; return 0; },
        getLunarMonthDays(y,m) { return (this.lunarInfo[y]&(0x10000>>m))?30:29; },
        lunarToSolar(year, month, day) {
            if(year<1900) year+=1900;
            let idx = year-1900, days=0;
            for(let y=1900; y<year; y++) days+=this.getLunarYearDays(y-1900);
            let leap = this.getLeapMonth(idx);
            for(let m=1; m<month; m++) days+=this.getLunarMonthDays(idx,m);
            if(leap && month>leap) days+=this.getLeapDays(idx);
            days += day - 1;
            let base = new Date(1900,0,31);
            let result = new Date(base);
            result.setDate(base.getDate() + days);
            return result;
        }
    };
    // 解析用户输入的农历字符串 "1995-04-29" -> 返回 { month, day }，忽略年份
    function parseLunarDate(input) {
        if(!input) return null;
        let parts = input.split('-');
        if(parts.length !== 3) return null;
        let year = parseInt(parts[0]);
        let month = parseInt(parts[1]);
        let day = parseInt(parts[2]);
        if(isNaN(month) || isNaN(day) || month<1 || month>12 || day<1 || day>30) return null;
        return { refYear: year, month, day };
    }
    // 获取指定年份的农历生日公历日期
    function getLunarBirthdaySolar(lunarMonth, lunarDay, targetYear) {
        return lunarCalendar.lunarToSolar(targetYear, lunarMonth, lunarDay);
    }
    async function saveCoupleInfo() {
        let maleLunar = parseLunarDate(document.getElementById('maleBirthLunar').value);
        let femaleLunar = parseLunarDate(document.getElementById('femaleBirthLunar').value);
        let info = {
            maleName: document.getElementById('maleName').value || "先生",
            maleLunarMonth: maleLunar ? maleLunar.month : null,
            maleLunarDay: maleLunar ? maleLunar.day : null,
            femaleName: document.getElementById('femaleName').value || "女士",
            femaleLunarMonth: femaleLunar ? femaleLunar.month : null,
            femaleLunarDay: femaleLunar ? femaleLunar.day : null,
            meetDate: document.getElementById('meetDate').value,
            engageDate: document.getElementById('engageDate').value,
            marryDate: document.getElementById('marryDate').value
        };
        // 预览一下
        let now = new Date();
        let y = now.getFullYear();
        let preview = '';
        if(info.maleLunarMonth && info.maleLunarDay) {
            let maleSolar = getLunarBirthdaySolar(info.maleLunarMonth, info.maleLunarDay, y);
            preview += `男方农历${info.maleLunarMonth}月${info.maleLunarDay}日，${y}年公历生日：${maleSolar.toLocaleDateString('zh-CN')}；`;
        }
        if(info.femaleLunarMonth && info.femaleLunarDay) {
            let femaleSolar = getLunarBirthdaySolar(info.femaleLunarMonth, info.femaleLunarDay, y);
            preview += `女方农历${info.femaleLunarMonth}月${info.femaleLunarDay}日，${y}年公历生日：${femaleSolar.toLocaleDateString('zh-CN')}`;
        }
        document.getElementById('lunarPreview').innerHTML = preview;
        let existing = await getAllData('couple_info');
        if(existing.length) { info.id = existing[0].id; await updateData('couple_info', info); }
        else await addData('couple_info', info);
        alert("纪念日信息已保存");
        renderAnniversary();
    }
    async function getCoupleInfo() { let list = await getAllData('couple_info'); return list.length ? list[0] : null; }
    function daysBetween(d1,d2) { return Math.round(Math.abs(d1-d2)/86400000); }
    function calculateCountdown(target) { let now = new Date(), diff = target - now; if(diff<0) return {passed:true, text:'已过去'}; let days = Math.floor(diff/86400000); return {passed:false, text:`${days}天`}; }
    function formatDate(d) { return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
    async function renderAnniversary() {
        let info = await getCoupleInfo();
        if(!info) { document.getElementById('coupleNames').innerHTML = '<p>请填写信息</p>'; return; }
        let now = new Date(), y = now.getFullYear();
        let maleBD = null, femaleBD = null;
        if(info.maleLunarMonth && info.maleLunarDay) {
            maleBD = getLunarBirthdaySolar(info.maleLunarMonth, info.maleLunarDay, y);
            if(maleBD < now) maleBD = getLunarBirthdaySolar(info.maleLunarMonth, info.maleLunarDay, y+1);
        }
        if(info.femaleLunarMonth && info.femaleLunarDay) {
            femaleBD = getLunarBirthdaySolar(info.femaleLunarMonth, info.femaleLunarDay, y);
            if(femaleBD < now) femaleBD = getLunarBirthdaySolar(info.femaleLunarMonth, info.femaleLunarDay, y+1);
        }
        let meet = info.meetDate ? new Date(info.meetDate) : null;
        let engage = info.engageDate ? new Date(info.engageDate) : null;
        let marry = info.marryDate ? new Date(info.marryDate) : null;
        let meetNext = meet ? new Date(y, meet.getMonth(), meet.getDate()) : null;
        if(meetNext && meetNext < now) meetNext.setFullYear(y+1);
        let engageNext = engage ? new Date(y, engage.getMonth(), engage.getDate()) : null;
        if(engageNext && engageNext < now) engageNext.setFullYear(y+1);
        let marryNext = marry ? new Date(y, marry.getMonth(), marry.getDate()) : null;
        if(marryNext && marryNext < now) marryNext.setFullYear(y+1);
        document.getElementById('coupleNames').innerHTML = `
            <div class="person-card"><div class="avatar">👨</div><div class="person-name">${info.maleName}</div><div class="birthday-countdown">🎂 ${maleBD?calculateCountdown(maleBD).text:'未设置'}</div><div class="progress-bar"><div class="progress-fill" style="width:${maleBD?Math.min(100,Math.max(0,100-(Math.floor((maleBD-now)/86400000)/365)*100)):0}%"></div></div></div>
            <div class="person-card"><div class="avatar">👩</div><div class="person-name">${info.femaleName}</div><div class="birthday-countdown">🎂 ${femaleBD?calculateCountdown(femaleBD).text:'未设置'}</div><div class="progress-bar"><div class="progress-fill" style="width:${femaleBD?Math.min(100,Math.max(0,100-(Math.floor((femaleBD-now)/86400000)/365)*100)):0}%"></div></div></div>
        `;
        let togetherDays = meet ? daysBetween(now, meet) : 0;
        let engagedDays = engage ? daysBetween(now, engage) : 0;
        let marriedDays = marry ? daysBetween(now, marry) : 0;
        let nextAnniversary = marryNext ? daysBetween(marryNext, now) : 0;
        document.getElementById('statsGrid').innerHTML = `
            <div class="stat-card"><div class="stat-number">${togetherDays}</div><div>相识</div></div>
            <div class="stat-card"><div class="stat-number">${engagedDays}</div><div>订婚</div></div>
            <div class="stat-card"><div class="stat-number">${marriedDays}</div><div>结婚</div></div>
            <div class="stat-card"><div class="stat-number">${nextAnniversary}</div><div>下次纪念</div></div>
        `;
        let timelineHtml = '';
        if(meet) timelineHtml += `<div class="timeline-item"><div class="timeline-date">${info.meetDate}</div><div>初次相遇 · ${togetherDays}天</div></div>`;
        if(engage) timelineHtml += `<div class="timeline-item"><div class="timeline-date">${info.engageDate}</div><div>订婚 · ${engagedDays}天</div></div>`;
        if(marry) timelineHtml += `<div class="timeline-item"><div class="timeline-date">${info.marryDate}</div><div>结婚 · ${marriedDays}天</div></div>`;
        document.getElementById('timelineEvents').innerHTML = timelineHtml;
        let events = [];
        if(maleBD) events.push({date: maleBD, name: `${info.maleName}生日`});
        if(femaleBD) events.push({date: femaleBD, name: `${info.femaleName}生日`});
        if(meetNext) events.push({date: meetNext, name: '相识纪念'});
        if(engageNext) events.push({date: engageNext, name: '订婚纪念'});
        if(marryNext) events.push({date: marryNext, name: '结婚纪念'});
        let qixi = lunarCalendar.lunarToSolar(y, 7, 7);
        if(qixi < now) qixi = lunarCalendar.lunarToSolar(y+1, 7, 7);
        events.push({date: qixi, name: '七夕'});
        let valentine = new Date(y, 1, 14);
        if(valentine < now) valentine.setFullYear(y+1);
        events.push({date: valentine, name: '情人节'});
        events = events.filter(e=>e.date >= now).sort((a,b)=>a.date-b.date).slice(0,5);
        let upcomingHtml = events.map(e => `<div class="event-card ${daysBetween(e.date,now)<=7?'urgent':''}"><div>${formatDate(e.date)}</div><div>${e.name}</div><div>${calculateCountdown(e.date).text}</div></div>`).join('');
        document.getElementById('upcomingList').innerHTML = upcomingHtml || '<p>暂无</p>';
        document.getElementById('qixiDate').innerHTML = formatDate(qixi);
        document.getElementById('qixiCountdown').innerHTML = calculateCountdown(qixi).text;
        document.getElementById('valentineDate').innerHTML = formatDate(valentine);
        document.getElementById('valentineCountdown').innerHTML = calculateCountdown(valentine).text;
    }

    async function exportData() { alert('导出功能开发中'); }

    function switchSection(section) {
        document.querySelectorAll('.nav-tab').forEach(t=>t.classList.toggle('active', t.dataset.section===section));
        document.querySelectorAll('.nav-item').forEach(i=>i.classList.toggle('active', i.dataset.section===section));

    document.addEventListener('DOMContentLoaded', async () => {
        document.getElementById('currentDate').innerHTML = new Date().toLocaleDateString('zh-CN', {year:'numeric',month:'long',day:'numeric',weekday:'long'});

        document.getElementById('babyRecordDate').value = getLocalDateString();

        loadOutfitHistory(); loadWeightData(); loadPeriodData(); loadDiaries(); loadBabyHistory();

            document.getElementById('maleName').value = info.maleName || '';

                // 重建显示字符串，年份随意使用1990年作为参考
                let displayYear = 1990;
                let displayStr = `${displayYear}-${String(info.maleLunarMonth).padStart(2,'0')}-${String(info.maleLunarDay).padStart(2,'0')}`;
                document.getElementById('maleBirthLunar').value = displayStr;
            }
            document.getElementById('femaleName').value = info.femaleName || '';
            if(info.femaleLunarMonth && info.femaleLunarDay) {
                let displayYear = 1990;
                let displayStr = `${displayYear}-${String(info.femaleLunarMonth).padStart(2,'0')}-${String(info.femaleLunarDay).padStart(2,'0')}`;
                document.getElementById('femaleBirthLunar').value = displayStr;
            }
            document.getElementById('meetDate').value = info.meetDate || '';
            document.getElementById('engageDate').value = info.engageDate || '';
            document.getElementById('marryDate').value = info.marryDate || '';
        }
        renderAnniversary();
    });
</script>
